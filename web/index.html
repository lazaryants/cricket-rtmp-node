<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket RTMP Node — Monitoring</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
    <link rel="stylesheet" href="style.css">
    <script defer src="/i18n.js?v=1"></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">🏏</span>
            <div class="brand-copy">
                <div class="brand-title">Cricket RTMP Node</div>
                <div class="brand-subtitle">Receiving and distribution server</div>
            </div>
        </div>
        <nav class="nav-menu" aria-label="Main navigation">
            <a href="/" class="active">Monitoring</a>
            <a href="/config/">Configuration</a>
            <a href="/admin/">Restreams</a>
        </nav>
    </header>

    <main>
        <div class="page-heading">
            <div>
                <h1>Live streams</h1>
                <p>Field monitoring · India &amp; Pakistan</p>
            </div>
            <div class="heading-actions">
                <span class="page-badge">System online</span>
                <div class="layout-switcher" aria-label="Cards per row">
                    <span>Columns</span>
                    <button type="button" data-columns="2">2</button>
                    <button type="button" data-columns="3">3</button>
                    <button type="button" data-columns="4">4</button>
                </div>
            </div>
        </div>
    <div class="grid" id="streamsGrid">
        <div class="loading-state">
            Loading streams...
        </div>
    </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js"></script>
</body>
</html>
